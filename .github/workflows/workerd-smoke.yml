name: workerd smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workerd-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workerd-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:celld

      # The build's pnpm lockfile pins workerd 1.20261023.1, which cannot parse
      # wrangler.json. tools/workerd pins 1.20261127.1 in a dedicated npm
      # lockfile so this must-pass check installs an integrity-verified binary
      # instead of resolving a floating version from the registry at run time.
      - name: Install pinned workerd
        run: npm ci --prefix tools/workerd --no-audit --no-fund

      - name: Boot dist/wrangler.json with workerd and probe /api/health
        run: bash scripts/workerd-smoke.sh
