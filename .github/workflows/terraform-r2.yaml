name: Terraform R2

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-r2.yaml"
  push:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-r2.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-r2-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: infra/terraform

env:
  TOFU_VERSION: 1.11.14

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - run: tofu fmt -check -recursive

      - run: tofu init -backend=false -input=false

      - run: tofu validate

  # apply は CI では行いません。手元で plan を確認してから実行します（infra/terraform/README.md）。
  plan:
    name: Plan
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_AWS_SECRET_ACCESS_KEY }}
      TF_VAR_state_passphrase: ${{ secrets.TF_STATE_PASSPHRASE }}
    steps:
      - name: Check secrets
        id: secrets
        working-directory: .
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ] && [ -n "$TF_VAR_state_passphrase" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Terraform secrets 未設定::CLOUDFLARE_API_TOKEN / TF_STATE_AWS_ACCESS_KEY_ID / TF_STATE_AWS_SECRET_ACCESS_KEY / TF_STATE_PASSPHRASE のいずれかが未設定（fork PR を含む）のため plan を skip します。"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.secrets.outputs.present == 'true'
        uses: actions/checkout@v4

      - if: steps.secrets.outputs.present == 'true'
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - if: steps.secrets.outputs.present == 'true'
        run: tofu init -input=false

      - if: steps.secrets.outputs.present == 'true'
        run: tofu plan -input=false -no-color -lock=false
