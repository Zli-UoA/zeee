# ⚠️ EXPERIMENTAL / NON-PRODUCTION ONLY — パイロット専用の「キー名だけ」の例。
# 値はすべてプレースホルダ。実秘密を絶対に書かないこと。
# このファイルは apply しないこと (実 Secret を上書きする危険がある)。
# 実際には README の kubectl create secret 手順で別途作成する。

apiVersion: v1
kind: Secret
metadata:
  name: workerd-pilot-cluster
type: Opaque
stringData:
  # openssl rand -hex 32 で生成した値を --from-literal で渡す。
  key: 'REPLACE_WITH_CLUSTER_KEY'
---
apiVersion: v1
kind: Secret
metadata:
  name: workerd-pilot-bucket
type: Opaque
stringData:
  # パイロット用バケットの書き込み権限を持つ専用 credential のみ。
  access-key: 'REPLACE_WITH_ACCESS_KEY_ID'
  secret-key: 'REPLACE_WITH_SECRET_ACCESS_KEY'
